[project]
name = "starter-langgraph"
version = "1.0.0"
description = "A LangGraph starter that finds people, verifies their work emails with Layrcake and drafts a campaign that waits for a person to approve."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.6",
    "langgraph>=1.2.16",
    "langchain-anthropic>=1.7.6",
    "langchain-openrouter>=0.2.9",
    "layrcake[agents]>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["agent.py", "instructions.py", "layrcake_tools.py", "smoke.py", "tests"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET"]
ignore = ["UP045", "UP007"]  # keep Optional[...] so pydantic reads the same types on 3.10
